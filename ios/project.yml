name: Fridge2Gether
options:
  bundleIdPrefix: edu.uci.team12
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  Fridge2Gether:
    type: application
    platform: iOS
    sources:
      - path: Fridge2Gether
    info:
      path: Fridge2Gether/Info.plist
      properties:
        CFBundleDisplayName: Fridge2Gether
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Take a photo of your groceries so Fridge2Gether can add them to your fridge.
        NSPhotoLibraryUsageDescription: Pick a photo of your groceries to add them to your fridge.
        UIAppFonts: [PatrickHand-Regular.ttf]
        DEEPSEEK_API_KEY: $(DEEPSEEK_API_KEY)
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.uci.team12.fridge2gether
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
